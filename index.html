<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarasi &amp; Chirantha — Save The Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Mrs+Saint+Delafield&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f9f1e5;
    --ink:#2a2117;
    --gold-1:#8a6a2f;
    --gold-2:#f2da93;
    --gold-3:#b8873c;
    --deep:#6f2c2c;
    --dark-1:#221a17;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    background:var(--dark-1);
    color:var(--cream);
    font-family:'EB Garamond', serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .script{ font-family:'Mrs Saint Delafield', cursive; }
  ::selection{ background:var(--gold-2); color:var(--dark-1); }

  .gold-text{
    background:linear-gradient(100deg, var(--gold-1) 15%, var(--gold-2) 40%, var(--gold-3) 55%, var(--gold-2) 75%, var(--gold-1) 90%);
    background-size:260% auto;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:shimmer 6s linear infinite;
  }
  @keyframes shimmer{ to{ background-position:-260% center; } }

  /* ============ STAGE ============ */
  .stage{
    position:relative; height:100svh; width:100%;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .stage video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;
    opacity:0.8;
  }
  .stage::after{
    content:""; position:absolute; inset:0; z-index:1;
    background:
      radial-gradient(ellipse at center, rgba(20,16,13,0.35) 0%, rgba(20,16,13,0.62) 68%, rgba(15,12,10,0.85) 100%),
      linear-gradient(180deg, rgba(15,12,10,0.55) 0%, rgba(15,12,10,0.15) 30%, rgba(15,12,10,0.15) 65%, rgba(15,12,10,0.8) 100%);
  }

  /* soft floating petals */
  .petals{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .petal{
    position:absolute; top:-8%; width:10px; height:10px; border-radius:50% 0 50% 50%;
    background:var(--gold-2); opacity:0.55;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:0.6; }
    92%{ opacity:0.5; }
    100%{ transform:translateY(110vh) translateX(var(--drift,40px)) rotate(340deg); opacity:0; }
  }

  .content{
    position:relative; z-index:3; text-align:center; padding:6vh 7vw; max-width:640px;
  }

  .fade-up{ opacity:0; transform:translateY(18px); animation:fadeUp 1.1s ease forwards; }
  @keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

  .eyebrow{
    font-family:'Cormorant Garamond', serif; font-weight:600; letter-spacing:0.36em;
    text-transform:uppercase; font-size:0.72rem; color:var(--gold-2); margin-bottom:1.4rem;
    animation-delay:0.15s;
  }

  .quote{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:500;
    font-size:clamp(1.1rem,3vw,1.5rem); line-height:1.55; color:#f0e7d6;
    max-width:34ch; margin:0 auto 2.2rem; animation-delay:0.4s;
  }
  .quote-mark{ color:var(--deep); opacity:0.85; font-size:1.15em; }

  .names{
    font-size:clamp(2.6rem,9vw,4.4rem); line-height:1; margin-bottom:0.6rem;
    animation-delay:0.7s;
  }
  .amp{ display:inline-block; font-size:0.55em; color:var(--gold-2); margin:0 0.15em; }

  .save-the-date{
    letter-spacing:0.3em; text-transform:uppercase; font-size:0.78rem;
    color:var(--gold-2); font-family:'Cormorant Garamond',serif; font-weight:600;
    margin-bottom:0.5rem; animation-delay:0.95s;
  }
  .date-line{
    font-family:'Cormorant Garamond',serif; font-weight:600; font-size:clamp(1.2rem,3.6vw,1.6rem);
    color:var(--cream); margin-bottom:2rem; animation-delay:1.1s;
  }

  .welcome{
    font-style:italic; font-size:0.98rem; color:#e9dfd0; opacity:0.85;
    margin-bottom:2.4rem; animation-delay:1.3s;
  }

  .open-btn{
    position:relative; display:inline-flex; align-items:center; gap:0.7rem;
    padding:0.95rem 2.4rem; background:transparent; cursor:pointer;
    border:1px solid var(--gold-2); border-radius:999px; color:var(--gold-2);
    font-family:'Cormorant Garamond',serif; font-weight:600; letter-spacing:0.22em;
    text-transform:uppercase; font-size:0.82rem; text-decoration:none;
    animation-delay:1.5s;
    transition:background .4s ease, color .4s ease, box-shadow .4s ease, transform .25s ease;
    overflow:hidden;
  }
  .open-btn::before{
    content:""; position:absolute; inset:0; border-radius:999px;
    box-shadow:0 0 0 0 rgba(240,215,140,0.5);
    animation:pulseRing 2.6s ease-out infinite;
  }
  @keyframes pulseRing{
    0%{ box-shadow:0 0 0 0 rgba(240,215,140,0.45); }
    70%{ box-shadow:0 0 0 14px rgba(240,215,140,0); }
    100%{ box-shadow:0 0 0 0 rgba(240,215,140,0); }
  }
  .open-btn:hover{
    background:var(--gold-2); color:var(--dark-1); transform:translateY(-3px);
  }
  .open-btn svg{ width:15px; height:15px; transition:transform .35s ease; }
  .open-btn:hover svg{ transform:translateX(4px); }

  .stage.closing .content{ animation:contentOut .7s ease forwards; }
  @keyframes contentOut{ to{ opacity:0; transform:translateY(-14px) scale(0.98); } }
  .stage.closing::after{ transition:opacity .9s ease; opacity:1; background:var(--dark-1); }
  .stage.closing video{ transition:opacity .9s ease; opacity:0; }

  .curtain{
    position:fixed; inset:0; z-index:10; background:var(--dark-1);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .7s ease;
  }
  .curtain.show{ opacity:1; pointer-events:all; }
  .curtain .script{ font-size:2.2rem; color:var(--gold-2); opacity:0; animation:fadeUp .8s ease .3s forwards; }

  @media (max-width:480px){
    .content{ padding:5vh 6vw; }
  }

  @media (prefers-reduced-motion: reduce){
    .fade-up{ animation:none!important; opacity:1!important; transform:none!important; }
    .gold-text, .petal, .open-btn::before{ animation:none!important; }
  }
</style>
</head>
<body>

<section class="stage" id="stage">
  <video autoplay muted playsinline loop>
    <source src="assets/save-the-date.mp4" type="video/mp4">
  </video>

  <div class="petals" id="petals"></div>

  <div class="content">
    <div class="eyebrow fade-up">Together With Their Families</div>

    <p class="quote fade-up"><span class="quote-mark">&ldquo;</span>Every love story is beautiful, but ours is my favourite.<span class="quote-mark">&rdquo;</span></p>

    <h1 class="names fade-up">
      <span class="script gold-text">Sarasi</span><span class="amp script">&amp;</span><span class="script gold-text">Chirantha</span>
    </h1>

    <div class="save-the-date fade-up">Save The Date</div>
    <div class="date-line fade-up">Friday · 21st August 2026</div>

    <p class="welcome fade-up">We joyfully welcome you into our story and invite you to be part of our beginning.</p>

    <a href="invitation.html" class="open-btn fade-up" id="openBtn">
      Open Invitation
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</section>

<div class="curtain" id="curtain"><span class="script">Unfolding our invitation&hellip;</span></div>

<script>
  // gentle floating petals
  const petalWrap = document.getElementById('petals');
  const count = window.innerWidth < 600 ? 10 : 18;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random()*100 + '%';
    p.style.setProperty('--drift', (Math.random()*80-40) + 'px');
    p.style.animationDuration = (9 + Math.random()*8) + 's';
    p.style.animationDelay = (Math.random()*10) + 's';
    p.style.width = p.style.height = (5 + Math.random()*7) + 'px';
    petalWrap.appendChild(p);
  }

  // transition to invitation page with animation
  const stage = document.getElementById('stage');
  const curtain = document.getElementById('curtain');
  const openBtn = document.getElementById('openBtn');

  openBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    stage.classList.add('closing');
    setTimeout(()=>{ curtain.classList.add('show'); }, 500);
    setTimeout(()=>{ window.location.href = 'invitation.html'; }, 1300);
  });
</script>

</body>
</html>
